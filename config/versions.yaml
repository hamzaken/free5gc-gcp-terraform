# Pinned versions of every runtime artefact. Images are pinned by tag AND
# digest ("name:tag@sha256:..."), so a re-pushed tag cannot change what runs.
#
# Compatibility (verified against upstream sources, see docs/architecture.md):
#   free5GC v4.2.2 -> go-upf v1.2.10 -> requires 0.9.5 <= gtp5g < 0.10.3
#   (intersection of the go-upf README table and the version check compiled
#   into the v1.2.10 binary). gtp5g 0.10.2 satisfies both.
#
# The Helm chart source pin (free5gc-helm tag + commit) lives in
# scripts/lib/pins.sh because it is consumed before Terraform runs.

free5gc_version: "v4.2.2"

gtp5g:
  version: "0.10.2"
  # GitHub tag archive of free5gc/gtp5g v0.10.2 (commit 952fb419130f5fc44cac1874e8183312006b746c).
  source_url: "https://codeload.github.com/free5gc/gtp5g/tar.gz/refs/tags/v0.10.2"
  source_sha256: "8fa39a54d2f1d443d4ced190799dcf777f017d5b9ab9ba414e331c4b9ba35123"
  # Range accepted by the UPF gate (min inclusive, max exclusive).
  upf_min_version: "0.9.5"
  upf_max_version_exclusive: "0.10.3"

# Images are referenced without registry. When the Artifact Registry Docker
# Hub proxy is enabled (default), Terraform prefixes them with
# <region>-docker.pkg.dev/<project>/<repo>/.
images:
