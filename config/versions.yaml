  upf: "free5gc/upf:v4.2.2@sha256:a9fa3ed6683f4390922cef122dd7c67ed6fb8674340abf7df73f7f47d47a7e04"
  # UERANSIM image tag shipped by the pinned ueransim chart (2.0.17).
