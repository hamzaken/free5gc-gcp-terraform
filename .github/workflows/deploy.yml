# Manual deployment workflow. It can create BILLABLE infrastructure, so:
#   - it only runs on explicit manual dispatch (never on push/PR);
#   - every job uses the "gcp-lab" GitHub Environment, which must be
#     configured with required reviewers (Settings > Environments);
#   - it authenticates with GitHub OIDC + Workload Identity Federation:
#     no service-account key exists anywhere.
#
# Required repository variables (Settings > Secrets and variables > Variables;
# none of them is secret):
#   GCP_PROJECT_ID      target project
#   GCP_WIF_PROVIDER    projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOY_SA       deployer service account email (impersonated via WIF)
#   TF_STATE_BUCKET     private, versioned GCS bucket for Terraform state
# See docs/deployment.md#github-actions for the one-time setup.

name: deploy (manual)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [plan, deploy, verify, destroy]
      confirm:
        description: 'Type the project ID to confirm deploy/destroy'
        required: false
        type: string

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

concurrency:
  group: deploy-${{ vars.GCP_PROJECT_ID }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "1"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  run:
    runs-on: ubuntu-24.04
    environment: gcp-lab
    timeout-minutes: 120
    steps:
      - name: Guard
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [[ "${ACTION}" == "deploy" || "${ACTION}" == "destroy" ]] && [[ "${CONFIRM}" != "${PROJECT}" ]]; then
            echo "::error::'${ACTION}' requires the confirm input to equal the project ID"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure remote state and variables
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          for stage in infra platform; do
            cp "terraform/${stage}/backend.tf.example" "terraform/${stage}/backend.tf"
            terraform -chdir="terraform/${stage}" init -input=false -backend-config="bucket=${TF_STATE_BUCKET}"
          done
          printf 'project_id = "%s"\n' "${PROJECT}" > terraform/infra/terraform.tfvars

      - name: Plan
        if: inputs.action == 'plan'
        run: terraform -chdir=terraform/infra plan -input=false

      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          # The manual dispatch, the typed project ID and the Environment
          # reviewers are the approval gate for this non-interactive run.
          ASSUME_YES: "1"
        run: scripts/deploy.sh

      - name: Verify
        if: inputs.action == 'deploy' || inputs.action == 'verify'
        run: scripts/verify.sh

      - name: Destroy
        if: inputs.action == 'destroy'
        env:
          ASSUME_YES: "1"
        run: scripts/destroy.sh

      - name: Upload verification evidence
        if: always() && (inputs.action == 'deploy' || inputs.action == 'verify')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence
          path: .evidence/
          retention-days: 14
